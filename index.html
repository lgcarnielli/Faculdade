<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - Classificador</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TensorFlow + Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border-radius: 20px;
            background: #ffffff;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #webcam-container canvas {
            border-radius: 15px;
            border: 4px solid #0d6efd;
        }

        .btn-camera {
            background: linear-gradient(45deg, #0d6efd, #6610f2);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn-camera:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .progress {
            height: 20px;
            border-radius: 10px;
        }

        .label-text {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card p-4 text-center">
                <h3 class="mb-3">🤖 Classificador de Imagem</h3>

                <button class="btn btn-camera mb-4" onclick="init()">
                    📷 Ativar Câmera
                </button>

                <div id="webcam-container" class="mb-4"></div>

                <div id="label-container"></div>
            </div>

        </div>
    </div>
</div>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/9Eqf4tt8e/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip);

        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("mb-3");

            const label = document.createElement("div");
            label.classList.add("label-text");

            const progress = document.createElement("div");
            progress.classList.add("progress");

            const progressBar = document.createElement("div");
            progressBar.classList.add("progress-bar");
            progressBar.style.width = "0%";

            progress.appendChild(progressBar);
            wrapper.appendChild(label);
            wrapper.appendChild(progress);

            labelContainer.appendChild(wrapper);
        }
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);

        for (let i = 0; i < maxPredictions; i++) {
            const probability = (prediction[i].probability * 100).toFixed(2);

            const wrapper = labelContainer.childNodes[i];
            const label = wrapper.childNodes[0];
            const progressBar = wrapper.childNodes[1].childNodes[0];

            label.innerHTML = `${prediction[i].className}: ${probability}%`;
            progressBar.style.width = `${probability}%`;
            progressBar.innerHTML = `${probability}%`;
        }
    }
</script>

</body>
</html>
